name: HA Config Check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check_config:
    name: Validate config with hass --script check_config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate dummy secrets.yaml
        run: |
          chmod +x ./scripts/gen_dummy_secrets.sh
          ./scripts/gen_dummy_secrets.sh > secrets.yaml

      - name: Run check_config in official HA container
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/home-assistant/home-assistant:stable
          options: -v ${{ github.workspace }}:/config
          run: |
            set -euo pipefail
            output=$(hass --script check_config --config /config 2>&1)
            echo "$output"
            # Blueprint loading errors are expected in CI: blueprint files
            # live outside this repo (blueprints/ is gitignored), so HA
            # cannot find them in the checkout. They are logged but do not
            # fail the job. Any other ERROR line fails the build.
            if echo "$output" | grep -qi 'ERROR.*blueprint'; then
              echo "::warning::Blueprint load errors suppressed (expected in CI):"
              echo "$output" | grep -i 'ERROR.*blueprint' || true
            fi
            if echo "$output" | grep -qi 'ERROR' && ! echo "$output" | grep -qi 'ERROR.*blueprint'; then
              echo "::error::Non-blueprint ERROR lines found - failing the job"
              exit 1
            fi
            echo "Config check passed (no non-blueprint ERROR lines)."
