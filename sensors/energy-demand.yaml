# Energy demands
# See: https://www.home-assistant.io/components/sensor.filter

# 1 hour
- platform: filter
  name: "1 hr usage"
  entity_id: sensor.energy_usage
  filters:
    - filter: time_simple_moving_average
      window_size: 01:00
      precision: 2

# 50 min
- platform: filter
  name: "50 min usage"
  entity_id: sensor.energy_usage
  filters:
    - filter: time_simple_moving_average
      window_size: 00:50
      precision: 2

# Medium time
- platform: filter
  name: "Medium usage"
  entity_id: sensor.energy_usage
  filters:
    - filter: time_simple_moving_average
      window_size: 00:20
      precision: 2

# Medium time
- platform: filter
  name: "Usage 25"
  entity_id: sensor.energy_usage
  filters:
    - filter: time_simple_moving_average
      window_size: 00:25
      precision: 2

# Medium time
- platform: filter
  name: "Medium long usage"
  entity_id: sensor.energy_usage
  filters:
    - filter: time_simple_moving_average
      window_size: 00:40
      precision: 2

# Fast time
- platform: filter
  name: "Fast usage"
  entity_id: sensor.energy_usage
  filters:
    - filter: time_simple_moving_average
      window_size: 00:10
      precision: 2

