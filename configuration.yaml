# For doorbell live streaming
ffmpeg:

# Enable the default set of integrations:
default_config:

# Activate the configuration editor
config:

frontend:
  extra_module_url:
    - /local/card-mod.js

# Allows you to issue voice commands from the frontend in enabled browsers
conversation:

# Log levels
logger:
  default: info

# Text to speech
tts:
  - platform: google_translate
    service_name: google_say

# Python
python_script:

# ifttt
ifttt:
  key: !secret ifttt_key

# Alexa
alexa:

# Turn on system health monitor
system_health:

# Timers
timer:
  dog_lights:
    duration: "00:10:00"
  wind_watchdog:
    duration: "00:15:00"
  energy_watchdog:
    duration: "00:10:00"

media_player:
  - platform: group
    name: Family Room TV Audio
    entities:
      - media_player.xantech_dax88_center
      - media_player.xantech_dax88_front
      - media_player.xantech_dax88_rear


# ios actions for Apple Watch
ios:
  actions:
    - name: "Desk lights"
      icon:
        icon: lightbulb
      label:
        text: "Desk lights"
    - name: "Master light"
      icon:
        icon: lightbulb
      label:
        text: "Master light"

recorder: !include recorder.yaml
input_number: !include input_numbers.yaml
input_boolean: !include input_booleans.yaml
sensor: !include_dir_merge_list sensors/
group: !include groups.yaml
automation ui: !include automations.yaml
automation mine: !include my_automations.yaml
script ui: !include scripts.yaml
script mine: !include_dir_merge_named scripts/
cover: !include covers.yaml
scene: !include scenes.yaml
template: !include templates.yaml

influxdb:
  tags_attributes:
    - friendly_name
  include:
    domains:
      - sensor
      - input_number
      - media_player
      - select

utility_meter:
  daily_energy:
    source: sensor.energy_usage
    name: Daily Energy Meter
    # cycle: daily
    # Hack: cycle 1 min before midnight to
    # keep the timestamp on the current day
    cron: "59 23 * * *"
    tariffs:
      - peak
      - offpeak
  monthly_energy:
    source: sensor.energy_usage
    name: Monthly Energy Meter
    cycle: monthly
    offset:
      days: 5
    tariffs:
      - peak
      - offpeak
